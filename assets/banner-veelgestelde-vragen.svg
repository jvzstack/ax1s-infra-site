<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#0070f3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4da3ff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#4da3ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4da3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12213f"/>
      <stop offset="100%" stop-color="#0b1526"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#08090f"/>
  <circle cx="1180" cy="220" r="480" fill="url(#glow1)"/>
  <circle cx="280" cy="700" r="420" fill="url(#glow2)"/>
  <circle cx="820" cy="780" r="300" fill="url(#glow1)" opacity="0.6"/>

  <!-- scattered question bubbles -->
  <g opacity="0.95">
    <rect x="210" y="150" width="200" height="130" rx="24" fill="url(#bubbleFill)" stroke="#2a3f66" stroke-width="2"/>
    <text x="310" y="240" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#4da3ff" text-anchor="middle">?</text>
  </g>
  <g opacity="0.95">
    <rect x="1180" y="120" width="220" height="150" rx="26" fill="url(#bubbleFill)" stroke="#2a3f66" stroke-width="2"/>
    <text x="1290" y="222" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#0070f3" text-anchor="middle">?</text>
  </g>
  <g opacity="0.9">
    <rect x="560" y="560" width="190" height="125" rx="22" fill="url(#bubbleFill)" stroke="#2a3f66" stroke-width="2"/>
    <text x="655" y="645" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#4da3ff" text-anchor="middle">?</text>
  </g>
  <g opacity="0.9">
    <rect x="1240" y="600" width="200" height="130" rx="24" fill="url(#bubbleFill)" stroke="#2a3f66" stroke-width="2"/>
    <text x="1340" y="690" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#0070f3" text-anchor="middle">?</text>
  </g>
  <g opacity="0.85">
    <rect x="70" y="560" width="160" height="105" rx="20" fill="url(#bubbleFill)" stroke="#2a3f66" stroke-width="2"/>
    <text x="150" y="635" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#4da3ff" text-anchor="middle">?</text>
  </g>

  <!-- central emphasis: magnifying glass / radar-style ring, ties into brand -->
  <circle cx="800" cy="420" r="150" fill="none" stroke="#0070f3" stroke-width="3" opacity="0.35"/>
  <circle cx="800" cy="420" r="95" fill="none" stroke="#4da3ff" stroke-width="3" opacity="0.55"/>
  <circle cx="800" cy="420" r="40" fill="none" stroke="#4da3ff" stroke-width="3" opacity="0.85"/>
  <text x="800" y="443" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle">?</text>
</svg>
